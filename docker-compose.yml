services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: partselect
      POSTGRES_USER: partselect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partselect}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partselect"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: partselect
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

volumes:
  pgdata:
