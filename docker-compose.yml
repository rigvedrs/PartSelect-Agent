services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: partselect
      POSTGRES_USER: partselect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partselect}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partselect"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: partselect
      UVICORN_RELOAD: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["bash", "entrypoint.sh"]
    volumes:
      - ./backend/data:/app/data
      - ./config.toml:/app/config.toml
      - ./backend/app:/app/app
      - ./backend/scrapers:/app/scrapers

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
